<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenIntel Bulk Contact Miner</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#07111f;--panel:#102038;--line:#294562;--text:#f5f8fc;--muted:#a8b8ca;--blue:#4c8dff;--green:#53d58b;--amber:#ffbf5b;--red:#ff6f7d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0,#17375f,var(--bg) 38%);color:var(--text);min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:26px}.head,.toolbar,.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:20px}.card{background:linear-gradient(180deg,#142842,#0f1e32);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:16px}.upload{border:2px dashed var(--line);text-align:center;padding:32px;border-radius:14px}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#142842;color:white;font-weight:800;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),#7368ff)}.btn.good{background:var(--green);border:0;color:#06150d}.btn.warn{background:#4a3516}.btn.danger{background:#421c27}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{background:#081625;border:1px solid var(--line);border-radius:10px;color:white;padding:10px}.stat{min-width:130px;padding:13px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:24px}.stat span,.muted{color:var(--muted);font-size:12px}.progress{height:12px;background:#081625;border-radius:99px;overflow:hidden;margin:14px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.table{overflow:auto;max-height:58vh}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{position:sticky;top:0;background:#102038;color:var(--muted);z-index:1}.pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#243b57}.found{color:#8aefb4}.failed{color:#ff9aa5}.pending{color:#ffd58f}a{color:#91c1ff}.hidden{display:none}.note{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:white;color:#081625;padding:12px 16px;border-radius:10px;font-weight:800;display:none}@media(max-width:650px){.wrap{padding:15px}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<div class="head"><div><h1 style="margin:0">OpenIntel Bulk Contact Miner</h1><div class="muted">Upload the list, run it, and keep the results short.</div></div><button id="settingsBtn" class="btn">Settings</button></div>
<div id="settings" class="card hidden"><b>Connection settings</b><div class="toolbar" style="margin-top:12px"><input id="apiUrl" style="min-width:310px" placeholder="https://openintel-api.onrender.com"><button id="saveSettings" class="btn primary">Save</button></div></div>
<div class="card"><div class="upload"><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden><button id="choose" class="btn primary">Choose Excel or CSV file</button><p id="fileLabel" class="muted">The app reads the “Key Decision Makers” sheet and skips suppressed contacts.</p></div></div>
<div id="workspace" class="hidden">
<div class="card"><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="done">0</b><span>Completed</span></div><div class="stat"><b id="found">0</b><span>Email found</span></div><div class="stat"><b id="notFound">0</b><span>Not found</span></div></div><div class="progress"><div id="bar"></div></div><div id="progressText" class="note">Ready</div><div class="toolbar" style="margin-top:14px"><button id="start" class="btn good">Start mining</button><button id="pause" class="btn warn" disabled>Pause</button><button id="retry" class="btn" disabled>Retry failed</button><button id="download" class="btn" disabled>Download results</button><button id="clear" class="btn danger">Clear session</button><select id="filter"><option value="all">All results</option><option value="found">Found</option><option value="not_found">Not found</option><option value="failed">Failed</option><option value="pending">Pending</option></select></div></div>
<div class="card table"><table><thead><tr><th>Name</th><th>What it found</th><th>Source link</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div><div id="toast" class="toast"></div>
<script>
(()=>{const STORE='openintel_bulk_v1';let data=JSON.parse(localStorage.getItem(STORE)||'{"contacts":[],"running":false,"paused":false}');let api=localStorage.getItem('openintel_api')||'https://openintel-api.onrender.com';const $=s=>document.querySelector(s);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORE,JSON.stringify(data));const toast=m=>{const x=$('#toast');x.textContent=m;x.style.display='block';setTimeout(()=>x.style.display='none',2500)};$('#apiUrl').value=api;$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('hidden');$('#saveSettings').onclick=()=>{api=$('#apiUrl').value.trim().replace(/\/$/,'');localStorage.setItem('openintel_api',api);toast('Settings saved')};$('#choose').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const sheet=wb.Sheets['Key Decision Makers']||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});data.contacts=rows.filter(r=>String(r['Suppressed']).toLowerCase()!=='yes').map((r,i)=>({id:i,first:String(r['First Name']||'').trim(),last:String(r['Surname']||'').trim(),company:String(r['Company']||'').trim(),title:String(r['Job Title']||'').trim(),status:'pending',found:'',source:'',error:''})).filter(x=>x.first&&x.last);data.paused=false;save();$('#fileLabel').textContent=f.name+' loaded';render();toast(data.contacts.length+' contacts loaded')}catch(err){toast('Could not read file: '+err.message)}};
function counts(){const c=data.contacts;return{total:c.length,done:c.filter(x=>['found','not_found','failed'].includes(x.status)).length,found:c.filter(x=>x.status==='found').length,notFound:c.filter(x=>x.status==='not_found').length}}
function render(){const c=counts();$('#workspace').classList.toggle('hidden',!c.total);$('#total').textContent=c.total;$('#done').textContent=c.done;$('#found').textContent=c.found;$('#notFound').textContent=c.notFound;$('#bar').style.width=(c.total?c.done/c.total*100:0)+'%';$('#progressText').textContent=data.running?'Mining '+(c.done+1)+' of '+c.total:data.paused?'Paused at '+c.done+' of '+c.total:c.done===c.total&&c.total?'Complete':'Ready';$('#start').disabled=data.running||!data.contacts.some(x=>x.status==='pending');$('#pause').disabled=!data.running;$('#retry').disabled=data.running||!data.contacts.some(x=>x.status==='failed');$('#download').disabled=!c.done;const filter=$('#filter').value;const list=data.contacts.filter(x=>filter==='all'||x.status===filter);$('#rows').innerHTML=list.map(x=>`<tr><td><b>${esc(x.first+' '+x.last)}</b></td><td class="${x.status==='found'?'found':x.status==='failed'?'failed':''}">${esc(x.found||x.error||(x.status==='pending'?'Waiting':'Not found'))}</td><td>${x.source?`<a href="${esc(x.source)}" target="_blank" rel="noopener">Open source</a>`:'-'}</td><td><span class="pill ${esc(x.status)}">${esc(x.status.replace('_',' '))}</span></td></tr>`).join('');save()}
async function mine(){if(data.running)return;data.running=true;data.paused=false;render();for(const x of data.contacts){if(data.paused||!data.running)break;if(x.status!=='pending')continue;x.status='running';render();try{const res=await fetch(api+'/api/find-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:x.first,lastName:x.last,knownCompany:x.company,knownTitle:x.title,country:'South Africa'})});const out=await res.json();if(!res.ok)throw new Error(out.detail||out.error||('HTTP '+res.status));x.status=out.email?'found':'not_found';x.found=out.email||'Not found';x.source=out.sourceUrl||''}catch(err){x.status='failed';x.error=err.message}save();render();await new Promise(r=>setTimeout(r,900))}data.running=false;save();render();toast(data.paused?'Mining paused':'Mining finished')}
$('#start').onclick=mine;$('#pause').onclick=()=>{data.paused=true;data.running=false;save();render()};$('#retry').onclick=()=>{data.contacts.forEach(x=>{if(x.status==='failed'){x.status='pending';x.error=''}});save();render();mine()};$('#filter').onchange=render;$('#clear').onclick=()=>{data={contacts:[],running:false,paused:false};save();render();$('#file').value='';$('#fileLabel').textContent='The app reads the “Key Decision Makers” sheet and skips suppressed contacts.'};
$('#download').onclick=()=>{const rows=data.contacts.map(x=>({'First Name':x.first,'Surname':x.last,'Company':x.company,'Job Title':x.title,'Email Found':x.status==='found'?x.found:'','Source Link':x.source,'Mining Status':x.status,'Notes':x.error}));const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Mining Results');XLSX.writeFile(wb,'OpenIntel_Mining_Results.xlsx')};data.contacts.forEach(x=>{if(x.status==='running')x.status='pending'});render()})();
</script></body></html>
